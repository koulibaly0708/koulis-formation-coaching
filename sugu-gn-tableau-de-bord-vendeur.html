<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
:root{--g:#0B7A43;--d:#054E2B;--o:#F5B301;--ink:#0A2E20;--m:#5C6B64;--bg:#F5F8F5;--t:#E7F3EC}
*{box-sizing:border-box;margin:0}
body{font:15px/1.55 Poppins,system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
a{color:inherit;text-decoration:none}button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}
[hidden]{display:none!important}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:25px;letter-spacing:-.5px}.logo img{width:44px;height:44px}.logo b{color:var(--o)}
.btn{border:0;border-radius:10px;padding:9px 15px;font-weight:600;cursor:pointer;background:var(--o);color:var(--ink);display:inline-block;text-align:center}
.btn.g{background:var(--g);color:#fff}.btn.l{background:none;color:var(--g);box-shadow:inset 0 0 0 1.5px var(--g)}
label{font-size:13px;font-weight:600;display:grid;gap:4px}
input{border:1.5px solid #cfdcd4;border-radius:10px;padding:10px 12px;background:#fff;width:100%}

/* Connexion */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--g),var(--d))}
.lc{background:#fff;border-radius:16px;padding:26px;width:min(420px,100%);display:grid;gap:12px}
.lc h1{font-size:22px;letter-spacing:-.5px}.lc p{color:var(--m);font-size:14px}
.err{background:#fdecec;color:#8a1c1c;border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px}
.back{color:#fff;font-size:14px;margin-top:14px;text-align:center;display:block}

/* Tableau de bord */
.bar{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 1px 10px #0002}
.bar .in{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1280px;margin:0 auto}
.shop{margin-left:auto;text-align:right;line-height:1.25}.shop small{color:var(--m);display:block}
.app{display:grid;grid-template-columns:1fr;max-width:1280px;margin:0 auto;gap:16px;padding:16px}
@media(min-width:860px){.app{grid-template-columns:230px 1fr}}
#tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
@media(min-width:860px){#tabs{flex-direction:column;overflow:visible;position:sticky;top:78px;align-self:start}}
#tabs button{background:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;text-align:left;white-space:nowrap;display:flex;gap:10px;align-items:center}
#tabs button:hover{background:var(--t)}
#tabs button[aria-current=page]{background:var(--g);color:#fff}
.panel{background:#fff;border-radius:16px;padding:22px;min-height:60vh}

</div>
</div>

<script>
const $=s=>document.querySelector(s),KEY="sugu_vendeur";

/* Onglets du tableau de bord : ajoutez une ligne ici par onglet.
   id, icône, titre, et contenu (fonction qui renvoie du HTML). */
const TABS=[
 {id:"apercu",ic:"🏠",t:"Aperçu",h:()=>`<h2>Bienvenue dans votre boutique</h2><p class="sub">Votre espace vendeur est prêt.</p><div class="empty">Les onglets de votre tableau de bord vont s'ajouter ici.</div>`}
];

function get(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function show(v){
 $("#login").hidden=!!v;$("#dash").hidden=!v;
 if(!v)return;
 $("#sn").textContent=v.boutique||"Ma boutique";$("#sw").textContent=v.i;
 $("#tabs").innerHTML=TABS.map(x=>`<button data-t="${x.id}"><span aria-hidden="true">${x.ic}</span>${x.t}</button>`).join("");
 tab(location.hash.slice(1)||TABS[0].id);
}
function tab(id){
 const x=TABS.find(t=>t.id===id)||TABS[0];
 $("#pn").innerHTML=x.h();history.replaceState(null,"","#"+x.id);
 document.querySelectorAll("#tabs button").forEach(b=>b.dataset.t===x.id?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
}
$("#tabs").onclick=e=>{const b=e.target.closest("button[data-t]");if(b)tab(b.dataset.t)};
$("#lf").onsubmit=e=>{
 e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
 if(!d.i.trim()||d.p.length<6){$("#le").textContent="Identifiant ou mot de passe incorrect. Le mot de passe compte au moins 6 caractères.";$("#le").hidden=false;return}
 /* À brancher : vérifier les identifiants auprès de votre serveur avant d'ouvrir la session. */
 const v={i:d.i.trim(),boutique:"Ma boutique"};
 localStorage.setItem(KEY,JSON.stringify(v));e.target.reset();$("#le").hidden=true;show(v);
};
$("#out").onclick=()=>{localStorage.removeItem(KEY);history.replaceState(null,"",location.pathname);show(null)};
show(get());
</script>
